[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "codeatlas"
version = "0.1.0"
description = "Local-first repository intelligence and change assurance"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.140,<1",
    "mcp>=1.2,<2",
    "pydantic>=2.12,<3",
    "tree-sitter>=0.25,<0.27",
    "tree-sitter-javascript>=0.23,<0.24",
    "tree-sitter-python>=0.25,<0.26",
    "tree-sitter-typescript>=0.23,<0.24",
    "typer>=0.27,<1",
    "uvicorn>=0.51,<1",
    "watchdog>=6.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    # Packaging only (P6-06). A dev dependency rather than a runtime one: the
    # packaged build does not contain its own packer.
    "pyinstaller>=6.11,<7",
    "mypy>=1.19,<2",
    "pytest>=9,<10",
    "ruff>=0.14,<1",
]

[project.scripts]
codeatlas = "codeatlas.cli.main:main"
codeatlas-mcp = "codeatlas.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/codeatlas"]

# Migrations are data files, not modules, so they must be force-included for
# `importlib.resources` to find them in an installed wheel.
[tool.hatch.build.targets.wheel.force-include]
"src/codeatlas/storage/sqlite/migrations" = "codeatlas/storage/sqlite/migrations"

[tool.pytest.ini_options]
addopts = "-ra -p no:cacheprovider --basetemp=.test-tmp"
pythonpath = ["src", "."]
testpaths = ["tests"]
norecursedirs = [
    "tests/evaluation/cases/fixtures",
    "tests/evaluation/cases/variants",
]

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = ["tests/evaluation/cases/fixtures", "tests/evaluation/cases/variants"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts", "apps"]
# Corpus fixtures and the P4-02 variant overlays are data, not code. They are
# deliberately duplicated across overlays — two variants may each carry their own
# `processor.py` — so type checking them is both meaningless and ambiguous.
exclude = ["tests/evaluation/cases/fixtures/", "tests/evaluation/cases/variants/"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# The `mcp` package ships untyped decorators, so the stdio wiring in
# `mcp/server.py` cannot satisfy strict decorator typing. The relaxation is
# scoped to that one module; everything it calls stays fully typed.
[[tool.mypy.overrides]]
module = ["codeatlas.mcp.server"]
disallow_untyped_decorators = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = [
    "tree_sitter_javascript",
    "tree_sitter_python",
    "tree_sitter_typescript",
]
ignore_missing_imports = true
