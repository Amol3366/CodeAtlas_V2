[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "codeatlas"
version = "0.1.0"
description = "Local-first repository intelligence and change assurance"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.12,<3",
]

[dependency-groups]
dev = [
    "mypy>=1.19,<2",
    "pytest>=9,<10",
    "ruff>=0.14,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/codeatlas"]

[tool.pytest.ini_options]
addopts = "-ra -p no:cacheprovider --basetemp=.test-tmp"
pythonpath = ["src"]
testpaths = ["tests"]
norecursedirs = ["tests/evaluation/cases/fixtures"]

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = ["tests/evaluation/cases/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]
exclude = ["tests/evaluation/cases/fixtures/"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
