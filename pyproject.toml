[project]
name = "codeatlas"
version = "0.1.0"
description = "Local-first, deterministic verified context and change-impact layer for AI-assisted development."
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    # API layer
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    # Storage: SQLite is the source of truth
    "sqlalchemy",
    "alembic",
    "aiosqlite",
    # Parsing
    "tree-sitter",
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    # File watching & matching
    "watchdog",
    "rapidfuzz",
    # Git
    "gitpython",
    # Infra
    "structlog",
    "orjson",
    "typer",
    "pyyaml",
    "tomli-w",
]

[project.optional-dependencies]
# Phase 12+: local semantic retrieval
semantic-local = [
    "sentence-transformers",
    "lancedb",
    "pyarrow",
]
# Phase 12+: OpenAI providers (embeddings + answering)
semantic-openai = [
    "openai",
    "lancedb",
    "pyarrow",
]
# HTTP client (Ollama adapter, REST client tests)
web = [
    "httpx",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "mypy",
    "ruff",
    "hypothesis",
    "types-pyyaml",
]

[project.scripts]
codeatlas = "codeatlas.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codeatlas"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Fixture repos are evaluation data with intentionally varied style; not linted.
# Alembic migrations are autogenerated; keep them out of lint/format churn.
extend-exclude = ["tests/fixtures", "migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["codeatlas"]
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Fixture repos are evaluation *data*, not CodeAtlas's own test suite. Their
# test_*.py files must never be collected by pytest.
addopts = "--ignore=tests/fixtures"
# Keep pytest's default ignores (.*, build, dist, ...) and add the fixture repos.
norecursedirs = [".*", "build", "dist", "*.egg", "node_modules", "tests/fixtures"]
