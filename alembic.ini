# Alembic configuration for CodeAtlas (SQLite, sync driver for migrations).
# The app runs on aiosqlite; migrations run on the sync pysqlite driver against
# the same DB file. Override the URL at runtime via CODEATLAS_ALEMBIC_URL.

[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os
sqlalchemy.url = sqlite:///./.codeatlas_dev.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
